name: WGram debug APK
run-name: ${{ inputs.check_java_only && 'WGram Android Java check' || 'WGram debug APK' }}
on:
  workflow_dispatch:
    inputs:
      check_java_only:
        description: 'Compile Android Java sources without building an APK'
        type: boolean
        default: false
      reuse_native:
        description: 'Reuse verified native code from the unchanged pinned source tree'
        type: boolean
        default: false
      run_ui_smoke:
        description: 'Open profiles and settings on an offline Android emulator'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      WGRAM_API_ID: ${{ secrets.WGRAM_API_ID }}
      WGRAM_API_HASH: ${{ secrets.WGRAM_API_HASH }}
    steps:
      - uses: actions/checkout@v4
      - name: Check build configuration
        env:
          WGRAM_FIREBASE_JSON: ${{ secrets.WGRAM_FIREBASE_JSON }}
        run: |
          python3 - <<'PYCONFIG'
          import json, os, pathlib, re
          api_id = os.environ.get('WGRAM_API_ID', '')
          api_hash = os.environ.get('WGRAM_API_HASH', '')
          if not re.fullmatch(r'[0-9]{1,9}', api_id) or int(api_id) <= 0 or not re.fullmatch(r'[0-9a-fA-F]{32}', api_hash):
              raise SystemExit('Set WGRAM_API_ID and WGRAM_API_HASH repository secrets.')
          firebase_json = os.environ.get('WGRAM_FIREBASE_JSON', '').strip()
          if not firebase_json:
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write('WGRAM_FIREBASE_ENABLED=false\n')
              print('Firebase disabled: background push notifications are unavailable in this build.')
              raise SystemExit(0)
          try:
              data = json.loads(firebase_json)
              packages = {client['client_info']['android_client_info']['package_name'] for client in data.get('client', [])}
          except (ValueError, KeyError, TypeError, AttributeError):
              raise SystemExit('Set WGRAM_FIREBASE_JSON to your Firebase configuration.')
          if 'org.wgram.messenger.beta' not in packages:
              raise SystemExit('Firebase configuration must include org.wgram.messenger.beta.')
          dest = pathlib.Path('TMessagesProj_App/src/debug/google-services.json')
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(data))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('WGRAM_FIREBASE_ENABLED=true\n')
          PYCONFIG
      - name: Restore WGram development signing key
        env:
          WGRAM_DEBUG_KEYSTORE_BASE64: ${{ secrets.WGRAM_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYSIGN'
          import base64, os, pathlib
          data = os.environ.get('WGRAM_DEBUG_KEYSTORE_BASE64', '').strip()
          if data:
              key = pathlib.Path.home() / '.android' / 'debug.keystore'
              key.parent.mkdir(parents=True, exist_ok=True)
              key.write_bytes(base64.b64decode(data, validate=True))
              key.chmod(0o600)
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write('WGRAM_DEBUG_KEYSTORE_PATH=' + str(key) + '\n')
              print('Using persistent WGram development signing key.')
          else:
              print('No persistent signing key configured; Android will generate a temporary debug key.')
          PYSIGN
      - name: Fetch native dependencies
        if: ${{ !inputs.reuse_native }}
        run: git submodule update --init --recursive --depth=1
      - name: Fetch Java dependency sources
        if: inputs.reuse_native
        run: git submodule update --init --recursive --depth=1 TMessagesProj_Modules/media TMessagesProj/lib/jlatexmath
      - uses: actions/download-artifact@v4
        if: inputs.reuse_native
        with:
          name: WGram-debug
          path: wgram/native-source
          run-id: 40206752484
          github-token: ${{ github.token }}
      - name: Verify native library source and APK
        if: inputs.reuse_native
        run: |
          python3 wgram/reuse_native.py wgram/native-source/app.apk
          echo 'ORG_GRADLE_PROJECT_wgramPrebuiltNative=true' >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install native build tools
        if: ${{ !inputs.reuse_native }}
        run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Validate WGram
        run: |
          sh wgram/test.sh
          python3 wgram/verify_resources.py
      - name: Compile Android Java sources
        if: inputs.check_java_only
        run: ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' :TMessagesProj_App:compileAfatDebugJavaWithJavac
      - name: Build debug APK
        if: ${{ !inputs.check_java_only }}
        run: ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' :TMessagesProj_App:assembleAfatDebug
      - name: Verify APK signature
        if: ${{ !inputs.check_java_only }}
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs TMessagesProj_App/build/outputs/apk/afat/debug/app.apk'
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.check_java_only }}
        with:
          name: WGram-debug
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
      - name: Build offline UI test APK
        if: ${{ inputs.run_ui_smoke && !inputs.check_java_only }}
        run: ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' :TMessagesProj_App:assembleAfatDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.run_ui_smoke && !inputs.check_java_only }}
        with:
          name: WGram-ui-test-apk
          path: TMessagesProj_App/build/outputs/apk/androidTest/**/*.apk
          if-no-files-found: error
      - name: Free space for Android emulator
        if: ${{ inputs.run_ui_smoke && !inputs.check_java_only }}
        run: |
          # Both APKs are already built. These ephemeral CI caches/tools are no longer needed.
          rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" "$HOME/.gradle/caches" "$HOME/.gradle/wrapper"
          df -h / "$ANDROID_HOME"
      - name: Run offline Android UI checks
        if: ${{ inputs.run_ui_smoke && !inputs.check_java_only }}
        timeout-minutes: 12
        run: |
          sdkmanager 'emulator' 'system-images;android-34;google_apis;x86_64'
          sudo chmod a+rw /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/wgram-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name wgram-smoke --package 'system-images;android-34;google_apis;x86_64' --device pixel_2 --force --path "$ANDROID_AVD_HOME/wgram-smoke.avd"
          test -f "$ANDROID_AVD_HOME/wgram-smoke.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x wgram-smoke
          mkdir -p wgram-ui-results
          "$ANDROID_HOME/emulator/emulator" -avd wgram-smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -cores 2 -memory 3072 > wgram-ui-results/emulator.log 2>&1 &
          timeout 60 adb wait-for-device
          # Airplane mode does not disable the emulator's virtual Ethernet.
          adb root
          timeout 30 adb wait-for-device
          # Preserve the emulator's ADB transport before rejecting Internet traffic.
          timeout 15 adb shell 'iptables -I OUTPUT 1 -p tcp --sport 5555 -j ACCEPT; iptables -I OUTPUT 2 ! -o lo -j REJECT'
          timeout 15 adb shell 'ip6tables -I OUTPUT 1 -p tcp --sport 5555 -j ACCEPT; ip6tables -I OUTPUT 2 ! -o lo -j REJECT'
          timeout 15 adb shell iptables -S OUTPUT > wgram-ui-results/network-policy.txt
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell input keyevent 82
          timeout 15 adb shell iptables -C OUTPUT -p tcp --sport 5555 -j ACCEPT
          timeout 15 adb shell iptables -C OUTPUT ! -o lo -j REJECT
          timeout 15 adb shell ip6tables -C OUTPUT ! -o lo -j REJECT
          timeout 15 adb shell iptables -S OUTPUT > wgram-ui-results/network-policy.txt
          adb shell cmd connectivity airplane-mode enable
          adb install -r -g TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          test_apk=$(find TMessagesProj_App/build/outputs/apk/androidTest -name '*.apk' -print -quit)
          adb install -r "$test_apk"
          # Finish first-boot work and compile the large debug APK before instrumented startup.
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell pm disable-user --user 0 com.google.android.googlequicksearchbox || true
          if [ "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" -ge 24 ]; then
            timeout 180 adb shell cmd package compile -m speed -f org.wgram.messenger.beta
            timeout 60 adb shell cmd package compile -m speed -f org.wgram.messenger.beta.test
          fi
          printf '%s\n' '<map><int name="overrideDevicePerformanceClass" value="2" /></map>' | adb shell 'run-as org.wgram.messenger.beta sh -c "mkdir -p shared_prefs; cat > shared_prefs/mainconfig.xml"'
          printf '%s\n' high > wgram-ui-results/performance.txt
          adb shell getprop ro.build.version.sdk > wgram-ui-results/android-api.txt
          timeout 15 adb logcat -c
          adb logcat -v threadtime > wgram-ui-results/logcat-live.txt 2>&1 &
          sha256sum TMessagesProj_App/build/outputs/apk/afat/debug/app.apk > wgram-ui-results/apk.sha256
          timeout 180 adb shell am instrument -w org.wgram.messenger.beta.test/org.telegram.wgram.tests.WGramUiSmoke | tee wgram-ui-results/instrumentation.txt
          timeout 15 adb logcat -d > wgram-ui-results/logcat.txt || true
          timeout 15 adb exec-out screencap -p > wgram-ui-results/screen.png || true
          timeout 20 adb pull /sdcard/Android/data/org.wgram.messenger.beta/files/wgram-ui-results wgram-ui-results/screens || true
          grep -q 'WGRAM_SMOKE_OK' wgram-ui-results/instrumentation.txt
      - name: Collect crash log
        if: ${{ always() && inputs.run_ui_smoke && !inputs.check_java_only }}
        run: |
          mkdir -p wgram-ui-results
          ps -eo pid,ppid,rss,comm --sort=-rss | head -20 > wgram-ui-results/host-processes.txt
          free -m > wgram-ui-results/host-memory.txt
          sudo dmesg | tail -100 > wgram-ui-results/host-kernel.txt || true
          timeout 10 adb logcat -d -b crash > wgram-ui-results/crash.txt || true
          timeout 10 adb shell dumpsys activity exit-info org.wgram.messenger.beta > wgram-ui-results/exit-info.txt || true
          timeout 10 adb shell dumpsys dropbox --print data_app_anr > wgram-ui-results/anr.txt || true
          timeout 10 adb root || true
          timeout 10 adb wait-for-device || true
          timeout 15 adb pull /data/anr wgram-ui-results/anr-traces || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.run_ui_smoke && !inputs.check_java_only }}
        with:
          name: WGram-ui-results
          path: wgram-ui-results/
