name: WGram checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Core behavior and Java syntax
        run: sh wgram/test.sh
      - name: Plugin behavior and crash recovery
        run: python3 -m unittest discover -s wgram/tests -p 'test_*.py' -v
      - name: Resources
        run: python3 wgram/verify_resources.py
      - name: Profile bot authentication and storage
        run: python3 -m unittest discover -s wgram/bot/tests -v
