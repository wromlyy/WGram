name: Publish verified WGram APK
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'APK build run; requires passed UI checks or a verified UI replay'
        required: true
        type: string
      ui_run:
        description: 'Optional successful UI replay run testing this exact APK'
        required: false
        type: string
      apk_sha256:
        description: 'Optional expected APK SHA-256; signature and package are always verified'
        required: false
        type: string
      tag:
        description: 'Release tag'
        required: true
        default: v0.3
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WGRAM_BUILD_RUN: ${{ inputs.source_run }}
      WGRAM_UI_RUN: ${{ inputs.ui_run }}
      WGRAM_APK_SHA: ${{ inputs.apk_sha256 }}
      WGRAM_RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check completed build and UI results
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9]+', os.environ['WGRAM_BUILD_RUN'])
          assert not os.environ['WGRAM_UI_RUN'] or re.fullmatch(r'[0-9]+', os.environ['WGRAM_UI_RUN'])
          assert not os.environ['WGRAM_APK_SHA'] or re.fullmatch(r'[a-f0-9]{64}', os.environ['WGRAM_APK_SHA'])
          assert re.fullmatch(r'v[0-9]+\.[0-9]+(?:\.[0-9]+)?', os.environ['WGRAM_RELEASE_TAG'])
          PY
          gh api "repos/$GH_REPO/actions/runs/$WGRAM_BUILD_RUN" > build-run.json
          gh api "repos/$GH_REPO/actions/runs/$WGRAM_BUILD_RUN/jobs" > build-jobs.json
          wgram_ui_run="${WGRAM_UI_RUN:-$WGRAM_BUILD_RUN}"
          gh api "repos/$GH_REPO/actions/runs/$wgram_ui_run" > ui-run.json
          gh api "repos/$GH_REPO/actions/runs/$wgram_ui_run/jobs" > ui-jobs.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('build-run.json'))
          jobs = json.load(open('build-jobs.json'))['jobs']
          assert run['path'] == '.github/workflows/wgram-apk.yml'
          for name in ['Build debug APK', 'Verify APK signature', 'Build offline UI test APK']:
              checks = [s for j in jobs for s in j['steps'] if s['name'] == name]
              assert len(checks) == 1 and checks[0]['conclusion'] == 'success', name + ' must pass'
          ui = json.load(open('ui-run.json'))
          ui_jobs = json.load(open('ui-jobs.json'))['jobs']
          assert ui['conclusion'] == 'success', 'UI run must succeed before publication'
          expected_path = '.github/workflows/wgram-ui-replay.yml' if os.environ['WGRAM_UI_RUN'] else '.github/workflows/wgram-apk.yml'
          assert ui['path'] == expected_path
          checks = [s for j in ui_jobs for s in j['steps'] if s['name'] == 'Run offline Android UI checks']
          assert len(checks) == 1 and checks[0]['conclusion'] == 'success', 'UI checks must pass'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('WGRAM_SOURCE_SHA=' + run['head_sha'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WGRAM_SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: WGram-debug
          path: verified-apk
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.ui_run != ''
        with:
          pattern: WGram-ui-api-*
          merge-multiple: true
          path: verified-ui
          run-id: ${{ inputs.ui_run }}
          github-token: ${{ github.token }}
      - name: Verify APK and create BotHost package
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os, pathlib, re, subprocess, zipfile
          source = pathlib.Path('verified-apk/app.apk')
          actual = hashlib.file_digest(source.open('rb'), 'sha256').hexdigest()
          if os.environ['WGRAM_UI_RUN']:
              tested = pathlib.Path('verified-ui/apk.sha256').read_text().split()[0]
              assert tested == actual, 'UI replay tested another APK'
              assert 'WGRAM_SMOKE_OK' in pathlib.Path('verified-ui/instrumentation.txt').read_text(), 'UI checks did not finish'
          if os.environ['WGRAM_APK_SHA']:
              assert actual == os.environ['WGRAM_APK_SHA'], 'Unexpected APK checksum'
          with zipfile.ZipFile(source) as apk:
              assert apk.testzip() is None, 'Damaged APK entry'
              assert 'AndroidManifest.xml' in apk.namelist()
              abis = sorted({name.split('/')[1] for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')})
              assert abis == ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools'
          signers = sorted(tools.glob('*/apksigner'))
          assert signers, 'Android signing verifier missing'
          signer = signers[-1]
          signature = subprocess.check_output([str(signer), 'verify', '--verbose', '--print-certs', str(source)], text=True)
          print(signature, flush=True)
          cert = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)', signature)
          assert cert and cert.group(1) == '6805db11fd8984f63fe91f4b4e9eea7f751b2a17a056bb08a25c7ad37325ab86', 'Unexpected WGram signing certificate'
          badging = subprocess.check_output([str(signer.parent / 'aapt'), 'dump', 'badging', str(source)], text=True)
          assert "package: name='org.wgram.messenger.beta'" in badging
          assert "versionCode='72399'" in badging
          assert "sdkVersion:'23'" in badging
          print(signature)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('WGRAM_VERIFIED_APK_SHA=' + actual + '\n')
          source.rename('WGram.apk')
          pathlib.Path('WGram.apk.sha256').write_text(actual + '  WGram.apk\n')
          print('Verified WGram.apk:', actual)
          PY
          python3 -m unittest discover -s wgram/bot/tests -v
          python3 wgram/package_bot.py WGramBot.zip
      - name: Publish standalone APK and separate bot project
        run: |
          cat > release-notes.md <<'NOTES'
          WGram 0.3: удалённый текст с отметкой × в чате, удобнее настройки и админка,
          изменяемый текст ограничения до отзыва, копирование профиля с подтверждением,
          варианты формы пузырей с примерами, канал @WGramnews.
          Исправлен вылет профиля с эмодзи; действия профиля собраны в один пункт WGram.
          До трёх наград рядом с именем в профиле, списке и заголовке личного чата.
          HTTPS-формат эмодзи сохраняет чтение прежних сообщений.

          Скачайте WGram.apk напрямую — распаковка не нужна.
          WGramBot.zip — отдельный проект бота для BotHost, не Android-приложение.
          Общие баннеры и значки требуют запуска бота и подключения HTTPS-сервиса.
          Бот не развёрнут автоматически. Инструкция находится в архиве бота.

          Пройдены сборка Android, проверки открытия экранов на офлайн-эмуляторе,
          поведения базы истории и аутентификации сервиса бота. Реальный вход,
          копирование профиля через Telegram и обмен между двумя аккаунтами требуют
          проверки на устройствах. Firebase выключен, фоновые уведомления могут задерживаться.
          NOTES
          gh release create "$WGRAM_RELEASE_TAG" --target "$WGRAM_SOURCE_SHA" --title "WGram ${WGRAM_RELEASE_TAG#v}" --notes-file release-notes.md --draft --prerelease
          gh release upload "$WGRAM_RELEASE_TAG" WGram.apk WGram.apk.sha256 WGramBot.zip WGramBot.zip.sha256
          gh release edit "$WGRAM_RELEASE_TAG" --draft=false --prerelease
      - name: Verify uploaded APK digest
        run: |
          gh release view "$WGRAM_RELEASE_TAG" --json assets,isDraft > published-release.json
          python3 - <<'PY'
          import json, os, pathlib
          release = json.load(open('published-release.json'))
          assert not release['isDraft']
          for name, checksum in [('WGram.apk', os.environ['WGRAM_VERIFIED_APK_SHA']), ('WGramBot.zip', pathlib.Path('WGramBot.zip.sha256').read_text().split()[0])]:
              assets = [a for a in release['assets'] if a['name'] == name]
              assert len(assets) == 1 and assets[0]['state'] == 'uploaded'
              assert assets[0]['size'] == pathlib.Path(name).stat().st_size
              assert assets[0]['digest'] == 'sha256:' + checksum
              print('Uploaded asset checksum verified:', name)
          PY
