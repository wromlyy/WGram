name: WGram APK UI replay
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Build run containing the app and instrumentation APKs'
        required: true
        type: string
      api_level:
        description: 'Android API level'
        required: true
        type: choice
        default: '35'
        options: ['23', '29', '35']
permissions:
  contents: read
  actions: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WGram-debug
          path: app
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: WGram-ui-test-apk
          path: test
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Run offline Android UI checks
        timeout-minutes: 14
        env:
          WGRAM_TEST_API: ${{ inputs.api_level }}
        run: |
          rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"
          sdkmanager 'emulator' "system-images;android-$WGRAM_TEST_API;google_apis;x86_64"
          sudo chmod a+rw /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/wgram-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name wgram-smoke --package "system-images;android-$WGRAM_TEST_API;google_apis;x86_64" --device pixel_2 --force --path "$ANDROID_AVD_HOME/wgram-smoke.avd"
          test -f "$ANDROID_AVD_HOME/wgram-smoke.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x wgram-smoke
          mkdir -p wgram-ui-results
          "$ANDROID_HOME/emulator/emulator" -avd wgram-smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -cores 2 -memory 3072 > wgram-ui-results/emulator.log 2>&1 &
          timeout 60 adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell settings put global airplane_mode_on 1
          adb shell svc wifi disable
          adb shell svc data disable
          adb install -r -g app/app.apk
          test_apk=$(find test -name '*.apk' -print -quit)
          adb install -r "$test_apk"
          # Finish first-boot work and compile the large debug APK before instrumented startup.
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell pm disable-user --user 0 com.google.android.googlequicksearchbox || true
          if [ "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" -ge 24 ]; then
            timeout 180 adb shell cmd package compile -m speed -f org.wgram.messenger.beta
            timeout 60 adb shell cmd package compile -m speed -f org.wgram.messenger.beta.test
          fi
          adb logcat -c
          sha256sum app/app.apk > wgram-ui-results/apk.sha256
          timeout 240 adb shell am instrument -w org.wgram.messenger.beta.test/org.telegram.wgram.tests.WGramUiSmoke | tee wgram-ui-results/instrumentation.txt
          adb logcat -d > wgram-ui-results/logcat.txt
          adb exec-out screencap -p > wgram-ui-results/screen.png
          adb pull /sdcard/Android/data/org.wgram.messenger.beta/files/wgram-ui-results wgram-ui-results/screens || true
          grep -q 'WGRAM_SMOKE_OK' wgram-ui-results/instrumentation.txt
      - name: Collect crash log
        if: always()
        run: |
          mkdir -p wgram-ui-results
          timeout 10 adb logcat -d -b crash > wgram-ui-results/crash.txt || true
          timeout 10 adb shell dumpsys activity exit-info org.wgram.messenger.beta > wgram-ui-results/exit-info.txt || true
          timeout 10 adb shell dumpsys dropbox --print data_app_anr > wgram-ui-results/anr.txt || true
          timeout 10 adb root || true
          timeout 10 adb wait-for-device || true
          timeout 15 adb pull /data/anr wgram-ui-results/anr-traces || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WGram-ui-api-${{ inputs.api_level }}
          path: wgram-ui-results
